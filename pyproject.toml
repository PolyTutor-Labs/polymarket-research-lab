[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdog"
version = "0.1.0"
description = "Educational Polymarket research and analysis laboratory for studying prediction-market data, calibration, paper experiments, and offline backtests"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  { name = "PolyTutor Labs" }
]
keywords = [
  "polymarket",
  "research",
  "analysis",
  "backtesting",
  "education",
  "prediction-markets",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "alembic>=1.14.0",
  "anthropic>=0.25.0",
  "aiosqlite>=0.20.0",
  "duckdb>=1.1.3",
  "feedparser>=6.0.11",
  "google-generativeai>=0.5.0",
  "httpx>=0.28.1",
  "numpy>=2.0.0",
  "openai>=1.0.0",
  "pandas>=2.2.3",
  "psycopg2-binary>=2.9",
  "praw>=7.8.1",
  "py-clob-client>=0.18.0",
  "pyarrow>=18.1.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-telegram-bot>=20.0",
  "python-dateutil>=2.9.0.post0",
  "SQLAlchemy>=2.0.36",
  "tenacity>=9.0.0",
  "typer[all]>=0.12.0",
  "vaderSentiment>=3.3.2",
  "websockets>=12.0",
  "aiohttp>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/PolyTutor-Labs/polymarket-research-lab"
Repository = "https://github.com/PolyTutor-Labs/polymarket-research-lab"
Issues = "https://github.com/PolyTutor-Labs/polymarket-research-lab/issues"
Changelog = "https://github.com/PolyTutor-Labs/polymarket-research-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "mypy>=1.14.0",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.3",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.4",
]

[project.scripts]
watchdog = "watchdog.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_default_fixture_loop_scope = "function"
# Defense in depth: never collect generated artifacts, datasets, or research notebooks.
norecursedirs = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "data",
  "docs",
  "outputs",
  "logs",
  "backtests",
  "research",
  "results",
  "reports",
  "Readings",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "data",
  "docs",
  "outputs",
  "logs",
  "backtests/results",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
pretty = true
show_error_codes = true
files = ["src"]
