name: Daily Run

on:
  schedule:
    - cron: '0 11 * * *'   # 6am Colombia (UTC-5) — daily
    - cron: '0 14 * * *'   # 9am Colombia (UTC-5) — daily
    - cron: '0 17 * * 1-6' # 12pm Colombia (UTC-5) — Mon–Sat (Sun handled by weekly cron below)
    - cron: '0 21 * * *'   # 4pm Colombia (UTC-5) — daily
    - cron: '0 17 * * 0'   # Sunday 12pm Colombia (UTC-5) — weekly summary
    - cron: '0 0 * * *'    # midnight UTC — EOD summary
  workflow_dispatch:

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  MANIFOLD_API_KEY: ${{ secrets.MANIFOLD_API_KEY }}
  MANIFOLD_USER_ID: ${{ secrets.MANIFOLD_USER_ID }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  # Repo-relative SQLite URL. Python resolves it against the checkout root.
  DATABASE_URL: sqlite:///watchdog.db

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # SECURITY (2026-09-08): dropped contents write; repo must not self-modify from CI.
    # Persist paper-trade DB via artifact upload only (Step 5).
    permissions:
      contents: read
      actions: write    # delete stale watchdog-db artifact only

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # ── Step 1: Restore DB ────────────────────────────────────────────────
      - name: Download previous DB artifact
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          workflow: daily_run.yml
          name: watchdog-db
          path: ${{ github.workspace }}
          if_no_artifact_found: ignore
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore DB
        run: |
          if [ -f watchdog-db/watchdog.db ]; then
            mv watchdog-db/watchdog.db watchdog.db
            echo "✅ DB restored: $(du -h watchdog.db | cut -f1) — $(sqlite3 watchdog.db 'SELECT COUNT(*) FROM trades;' 2>/dev/null || echo '?') trades"
          else
            echo "⚠️ No artifact found — fresh DB"
          fi

      # ── Step 1b: Delete stale artifact so next run starts fresh ──────────
      - name: Delete stale artifact
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts \
            --jq '.artifacts[] | select(.name=="watchdog-db") | .id' \
            | xargs -I{} gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/{} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: Init DB (create missing tables, run migrations) ──────────
      - name: Init DB
        run: watchdog init-db

      # ── Step 2b: Restore baseline if artifact was missing ─────────────────
      - name: Restore baseline
        run: watchdog restore-baseline

      # ── Step 2c: Show portfolio state immediately after baseline restore ────
      - name: Portfolio status check
        run: watchdog portfolio-status

      # ── Step 3: Confirm exact DB path and trade count ─────────────────────
      - name: Debug — verify DB path and trade count
        run: |
          python -c "
          from watchdog.core.config import get_settings
          from watchdog.db.session import build_engine
          engine = build_engine(get_settings())
          print('ENGINE URL:', engine.url)
          "
          watchdog analyze-paper-trades 2>&1 | head -5 || true

      # ── Step 4: Strategy steps ────────────────────────────────────────────
      - name: Run Polymarket paper trading
        run: watchdog run-paper-trading --platform polymarket --iterations 5 --max-markets 300 || true

      - name: Run Manifold paper trading
        run: watchdog run-paper-trading --platform manifold --iterations 5 || true

      - name: Run intra-event ARB scan
        run: watchdog run-intra-event-arb || true

      - name: Run pair cost scan
        run: watchdog run-pair-cost-scan || true

      - name: Run resolution check
        run: watchdog run-resolution-check || true

      - name: Run whale watch
        run: watchdog run-whale-watch || true

      - name: Run OFI scan
        run: watchdog run-ofi-scan || true

      - name: Run ensemble scan
        run: watchdog run-ensemble-scan || true

      - name: Run daily summary
        run: watchdog run-daily-summary || true

      - name: Analyze paper trades
        run: watchdog analyze-paper-trades || true

      - name: Portfolio status before Telegram
        run: watchdog portfolio-status || true

      - name: Send Telegram summary
        if: always()
        run: watchdog send-daily-telegram || true

      # ── Step 5: Persist DB ────────────────────────────────────────────────
      - name: Upload DB artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watchdog-db
          path: watchdog.db
          retention-days: 7
          overwrite: true

      # ── Step 6: seed auto-commit — DISABLED (security remediation 2026-09-08) ─
      # SECURITY: Removed automatic commit and remote update of db/seed_data.sql.
      # Privileged CI mutation of main elevates blast radius of a compromised Action.
      # Persist state via the watchdog-db artifact only. Do not re-enable without review.

  # ── EOD summary — fires at midnight UTC (7pm Colombia) ──────────────────
  eod-summary:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 0 * * *'
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Download previous DB artifact
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          workflow: daily_run.yml
          name: watchdog-db
          path: ${{ github.workspace }}
          if_no_artifact_found: ignore
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore DB
        run: |
          if [ -f watchdog-db/watchdog.db ]; then
            mv watchdog-db/watchdog.db watchdog.db
            echo "✅ DB restored for EOD summary"
          else
            echo "⚠️ No artifact — EOD summary will show zeros"
          fi

      - name: Init DB
        run: watchdog init-db

      - name: Send EOD summary
        run: watchdog send-eod-summary

  # ── Weekly summary — fires only on Sundays at 17:00 UTC (12pm Colombia) ──
  weekly-summary:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 17 * * 0'
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Download previous DB artifact
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          workflow: daily_run.yml
          name: watchdog-db
          path: ${{ github.workspace }}
          if_no_artifact_found: ignore
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore DB
        run: |
          if [ -f watchdog-db/watchdog.db ]; then
            mv watchdog-db/watchdog.db watchdog.db
            echo "✅ DB restored: $(du -h watchdog.db | cut -f1) — $(sqlite3 watchdog.db 'SELECT COUNT(*) FROM trades;' 2>/dev/null || echo '?') trades"
          else
            echo "⚠️ No artifact found — weekly summary will show zeros"
          fi

      - name: Init DB
        run: watchdog init-db

      - name: Send weekly Telegram summary
        run: watchdog send-weekly-telegram
